<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>智賬</title>
<meta name="description" content="智賬 — 兩人共同記帳 App">
<meta name="theme-color" content="#F7F7F4">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="智賬">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>

<!-- ============ Books ============ -->
<section id="view-books" class="view">
  <div class="page-head">
    <span class="logo-mark">智</span>
    <div class="segmented seg-pill" id="segBooksMode">
      <button class="seg-btn active" data-mode="calendar">日曆</button>
      <button class="seg-btn" data-mode="list">列表</button>
    </div>
    <button id="btnSearch" class="icon-btn" aria-label="搜尋">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    </button>
  </div>

  <div class="month-nav">
    <button class="icon-btn" id="booksPrev" aria-label="上個月">‹</button>
    <div class="month-title month-title-btn" id="booksMonthTitle" role="button" tabindex="0">
      <span id="booksMonthText"></span> <span class="caret">▾</span>
    </div>
    <button class="icon-btn" id="booksNext" aria-label="下個月">›</button>
  </div>

  <!-- 日曆模式 -->
  <div id="booksCalendar">
    <div class="card cal-card">
      <div class="cal-week">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="cal-grid" id="calGrid"></div>
    </div>
    <div id="dayDetail"></div>
  </div>

  <!-- 列表模式 -->
  <div id="booksList" hidden>
    <div class="segmented" id="segListFilter">
      <button class="seg-btn active" data-filter="io">收支</button>
      <button class="seg-btn" data-filter="transfer">轉帳</button>
      <button class="seg-btn" data-filter="all">全部</button>
    </div>
    <div class="month-summary card-flat" id="listSummary"></div>
    <div id="txList"></div>
  </div>
</section>

<!-- ============ Accounts（成員結算） ============ -->
<section id="view-accounts" class="view" hidden>
  <div class="page-head"><span class="logo-mark">智</span><div class="page-title">成員結算</div><span class="head-spacer"></span></div>
  <div id="accountsBody"></div>
</section>

<!-- ============ Reports ============ -->
<section id="view-reports" class="view" hidden>
  <div class="page-head">
    <span class="logo-mark">智</span>
    <div class="segmented seg-pill" id="segRepPeriod">
      <button class="seg-btn active" data-period="month">月</button>
      <button class="seg-btn" data-period="year">年</button>
      <button class="seg-btn" data-period="range">範圍</button>
    </div>
    <span class="head-spacer"></span>
  </div>

  <div class="month-nav" id="repNav">
    <button class="icon-btn" id="repPrev" aria-label="上一個">‹</button>
    <div class="month-title" id="repTitle"></div>
    <button class="icon-btn" id="repNext" aria-label="下一個">›</button>
  </div>

  <div id="repIOWrap" class="segmented" style="margin-bottom:14px">
    <button class="seg-btn active" data-kind="expense">支出</button>
    <button class="seg-btn" data-kind="income">收入</button>
    <button class="seg-btn" data-kind="transfer">轉帳</button>
  </div>

  <div id="repBody"></div>
</section>

<!-- ============ Settings ============ -->
<section id="view-settings" class="view" hidden>
  <div class="page-head"><span class="logo-mark">智</span><div class="page-title">設定</div><span class="head-spacer"></span></div>
  <div class="row-list">
    <button type="button" class="form-row" data-set="members">
      <span class="ric">👥</span><span class="rlab">誰付的</span>
      <span class="rval" id="setMembersVal"></span><span class="chev">›</span>
    </button>
    <button type="button" class="form-row" data-set="categories">
      <span class="ric">🏷️</span><span class="rlab">類別管理</span>
      <span class="rval"></span><span class="chev">›</span>
    </button>
  </div>
  <div class="row-list">
    <button type="button" class="form-row" data-set="sync">
      <span class="ric">☁️</span><span class="rlab">雲端同步</span>
      <span class="rval" id="setSyncVal"></span><span class="chev">›</span>
    </button>
  </div>
  <div class="row-list">
    <button type="button" class="form-row" data-set="export">
      <span class="ric">📤</span><span class="rlab">匯出資料</span>
      <span class="rval"></span><span class="chev">›</span>
    </button>
    <button type="button" class="form-row" data-set="import">
      <span class="ric">📥</span><span class="rlab">匯入資料</span>
      <span class="rval"></span><span class="chev">›</span>
    </button>
    <input id="fileImport" type="file" accept="application/json" hidden>
  </div>
  <p class="hint">資料儲存在這台裝置的瀏覽器中，可用「匯出／匯入」在兩台手機之間同步（依 id 合併去重）。</p>
</section>

</main>

<nav class="tabbar">
  <button class="tab active" data-view="books">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4a2 2 0 0 0-2-2H6.5A2.5 2.5 0 0 0 4 4.5z"/><path d="M20 17v5H6.5a2.5 2.5 0 0 1 0-5"/></svg>
    <span>Books</span>
  </button>
  <button class="tab" data-view="accounts">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3l4 4-4 4M21 7H8M7 21l-4-4 4-4M3 17h13"/></svg>
    <span>Accounts</span>
  </button>
  <button class="tab tab-add" id="btnAdd" aria-label="記一筆">
    <span class="add-circle">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </span>
  </button>
  <button class="tab" data-view="reports">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.4 4"/></svg>
    <span>Reports</span>
  </button>
  <button class="tab" data-view="settings">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Settings</span>
  </button>
</nav>

<!-- ============ 記一筆（整頁覆蓋） ============ -->
<div id="addPage" class="add-page" hidden>
  <div class="add-head">
    <button id="btnAddClose" class="icon-btn icon-btn-plain" aria-label="關閉">✕</button>
    <div class="segmented seg-pill" id="segAddType">
      <button class="seg-btn active" data-type="expense">支出</button>
      <button class="seg-btn" data-type="income">收入</button>
      <button class="seg-btn" data-type="transfer">轉帳</button>
    </div>
    <span class="head-spacer"></span>
  </div>

  <div class="add-body">
    <div class="add-date-wrap">
      <button type="button" id="addDateBtn" class="add-date"></button>
    </div>

    <div class="row-list">
      <div class="form-row" id="amountRow" style="cursor:default">
        <span class="ric">💵</span><span class="rlab">金額</span>
        <input id="amountInput" class="amount-input" type="text" inputmode="decimal" placeholder="金額" autocomplete="off">
        <span id="amountEval" class="amount-eval"></span>
        <button type="button" class="kbd-toggle" id="btnKeypadToggle" aria-label="計算鍵盤">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M7 9h.01M11 9h.01M15 9h.01M7 13h.01M11 13h.01M15 13h.01M7 17h10"/></svg>
        </button>
      </div>
      <div id="addRows"></div>
    </div>

    <!-- 手續費（轉帳） -->
    <div id="feeCard" class="row-list" hidden>
      <div class="form-row" style="cursor:default">
        <span class="ric">🏳️</span><span class="rlab">手續費</span>
        <span class="rval"></span>
        <label class="switch"><input type="checkbox" id="feeToggle"><span class="knob"></span></label>
      </div>
      <div id="feeFields" hidden>
        <div class="form-row" style="cursor:default">
          <span class="ric">💵</span><span class="rlab">金額</span>
          <input id="feeAmount" class="fee-input" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0">
        </div>
        <button type="button" class="form-row" data-row="feePayer">
          <span class="ric">👤</span><span class="rlab">誰付的</span>
          <span class="rval filled" id="feePayerVal"></span><span class="chev">›</span>
        </button>
      </div>
    </div>

    <div class="card memo-card">
      <textarea id="addNote" class="memo-input" placeholder="備註⋯" rows="4"></textarea>
    </div>
  </div>

  <div class="add-foot" id="addFoot">
    <button id="btnSaveClose" class="btn btn-outline">儲存</button>
    <button id="btnSaveContinue" class="btn btn-primary">儲存並繼續</button>
  </div>

  <!-- 計算鍵盤 -->
  <div id="keypad" class="keypad" hidden>
    <div class="keypad-top">
      <button class="kp kp-fn" data-k="00">00</button>
      <button class="kp kp-fn" data-k="000">000</button>
      <span style="flex:1"></span>
      <button class="kp kp-fn" id="kpDone">完成</button>
    </div>
    <div class="keypad-grid">
      <button class="kp kp-op" data-k="÷">÷</button><button class="kp" data-k="1">1</button><button class="kp" data-k="2">2</button><button class="kp" data-k="3">3</button>
      <button class="kp kp-op" data-k="×">×</button><button class="kp" data-k="4">4</button><button class="kp" data-k="5">5</button><button class="kp" data-k="6">6</button>
      <button class="kp kp-op" data-k="−">−</button><button class="kp" data-k="7">7</button><button class="kp" data-k="8">8</button><button class="kp" data-k="9">9</button>
      <button class="kp kp-op" data-k="+">+</button><button class="kp" data-k=".">.</button><button class="kp" data-k="0">0</button><button class="kp kp-op" data-k="⌫">⌫</button>
    </div>
  </div>
</div>

<!-- ============ 搜尋（整頁覆蓋） ============ -->
<div id="searchPage" class="add-page" hidden>
  <div class="add-head">
    <button id="btnSearchClose" class="icon-btn icon-btn-plain" aria-label="關閉">✕</button>
    <input id="searchInput" class="input search-input" type="search" placeholder="搜尋類別、備註、成員⋯">
  </div>
  <div class="add-body" id="searchResults">
    <div class="empty"><div class="big">🔍</div>輸入關鍵字搜尋全部歷史記錄</div>
  </div>
</div>

<!-- ============ 類別管理（整頁覆蓋） ============ -->
<div id="catPage" class="add-page" hidden>
  <div class="add-head">
    <button id="btnCatClose" class="icon-btn icon-btn-plain" aria-label="關閉">✕</button>
    <div class="segmented seg-pill" id="segCatType">
      <button class="seg-btn active" data-type="expense">支出</button>
      <button class="seg-btn" data-type="income">收入</button>
    </div>
    <span class="head-spacer"></span>
  </div>
  <div class="add-body">
    <div class="cat-tiles" id="catTiles"></div>
    <p class="hint" style="text-align:center">點選類別即可編輯名稱與 emoji，或刪除</p>
  </div>
</div>

<!-- 類別編輯 -->
<dialog id="dlgCatEdit" class="dialog">
  <h2 class="dialog-title" id="catEditTitle">編輯類別</h2>
  <div class="field field-row">
    <div class="col" style="flex:0 0 88px">
      <label class="field-label" for="inpCatEmoji">Emoji</label>
      <input id="inpCatEmoji" class="input cat-emoji-input" maxlength="4" placeholder="📌">
    </div>
    <div class="col">
      <label class="field-label" for="inpCatName">名稱</label>
      <input id="inpCatName" class="input" maxlength="10" placeholder="類別名稱">
    </div>
  </div>
  <div class="dialog-actions">
    <button id="btnCatDelete" class="btn btn-danger">刪除</button>
    <button id="btnCatCancel" class="btn btn-ghost">取消</button>
    <button id="btnCatSave" class="btn btn-primary">儲存</button>
  </div>
</dialog>

<!-- 成員名稱 -->
<dialog id="dlgMembers" class="dialog">
  <h2 class="dialog-title">誰付的 — 成員名稱</h2>
  <div class="field">
    <label class="field-label" for="inpName1">你的名字</label>
    <input id="inpName1" class="input" maxlength="8">
  </div>
  <div class="field">
    <label class="field-label" for="inpName2">另一半的名字</label>
    <input id="inpName2" class="input" maxlength="8">
  </div>
  <div class="dialog-actions">
    <button id="btnMembersCancel" class="btn btn-ghost">取消</button>
    <button id="btnMembersSave" class="btn btn-primary">儲存</button>
  </div>
</dialog>

<!-- 誰要分攤 -->
<dialog id="dlgSplit" class="dialog sheet">
  <h2 class="dialog-title">誰要分攤</h2>
  <div class="field">
    <div id="splitWho" class="check-row"></div>
  </div>
  <div class="field">
    <label class="field-label">分攤方式</label>
    <div class="segmented" id="segSplitMode">
      <button class="seg-btn active" data-mode="even">平均分攤</button>
      <button class="seg-btn" data-mode="custom">自訂金額</button>
    </div>
    <div id="splitDetail" class="split-detail"></div>
  </div>
  <div class="dialog-actions">
    <button id="btnSplitDone" class="btn btn-primary btn-block">完成</button>
  </div>
</dialog>

<!-- 選擇器（底部彈出） -->
<dialog id="dlgPicker" class="dialog sheet">
  <h2 class="dialog-title" id="pickerTitle"></h2>
  <div id="pickerBody"></div>
</dialog>

<!-- 記錄操作 -->
<dialog id="dlgTxAction" class="dialog">
  <h2 class="dialog-title" id="txActionTitle">這筆記錄</h2>
  <div class="dialog-actions dialog-actions-col">
    <button id="btnTxEdit" class="btn btn-ghost btn-block">編輯</button>
    <button id="btnTxDelete" class="btn btn-danger btn-block">刪除</button>
    <button id="btnTxCancel" class="btn btn-primary btn-block">取消</button>
  </div>
</dialog>

<!-- 雲端同步 -->
<dialog id="dlgSync" class="dialog">
  <h2 class="dialog-title">雲端即時同步</h2>
  <div id="syncBody"></div>
</dialog>

<!-- 日期選擇器 -->
<dialog id="dlgDate" class="dialog sheet">
  <div class="dp-head">
    <button type="button" class="icon-btn" id="dpPrev" aria-label="上一個">‹</button>
    <div class="month-title month-title-btn" id="dpTitle"></div>
    <button type="button" class="icon-btn" id="dpNext" aria-label="下一個">›</button>
  </div>
  <div class="cal-week" id="dpWeek">
    <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
  </div>
  <div class="cal-grid" id="dpGrid"></div>
  <div class="dp-cells" id="dpMonths" hidden></div>
  <div class="dp-cells" id="dpYears" hidden></div>
  <div class="dialog-actions" style="margin-top:14px">
    <button type="button" id="dpYesterday" class="btn btn-ghost">昨天</button>
    <button type="button" id="dpToday" class="btn btn-ghost">今天</button>
    <button type="button" id="dpCancel" class="btn btn-outline">取消</button>
  </div>
</dialog>

<!-- 自訂日期範圍 -->
<dialog id="dlgRange" class="dialog">
  <h2 class="dialog-title">日期範圍</h2>
  <div class="range-quick">
    <button class="btn btn-ghost btn-block" data-quick="7">最近 7 天</button>
    <button class="btn btn-ghost btn-block" data-quick="30">最近 30 天</button>
    <button class="btn btn-ghost btn-block" data-quick="90">最近 90 天</button>
    <button class="btn btn-ghost btn-block" data-quick="all">全部期間</button>
  </div>
  <div class="field field-row" style="margin-top:14px">
    <div class="col">
      <label class="field-label" for="inpRangeStart">開始</label>
      <input id="inpRangeStart" type="date" class="input">
    </div>
    <div class="col">
      <label class="field-label" for="inpRangeEnd">結束</label>
      <input id="inpRangeEnd" type="date" class="input">
    </div>
  </div>
  <div class="dialog-actions">
    <button id="btnRangeCancel" class="btn btn-ghost">取消</button>
    <button id="btnRangeApply" class="btn btn-primary">套用</button>
  </div>
</dialog>

<div id="toast" class="toast" hidden></div>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
